<title>선박왕</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a nautical chart on top (phone) or left (desktop), an operations ledger below/right. */
:root {
  --bg: #e9eff2; --panel: #ffffff; --panel-2: #f3f6f8; --ink: #14202e; --muted: #5b6977; --line: #d2dbe1;
  --sea: #cde0eb; --land: #eee6cc; --land-edge: #b8a982; --river: #4f8cc2; --lane: #7c9bb1;
  --brand: #0b4f8a; --brand-ink: #ffffff; --accent: #e3a008; --mine: #e2580f;
  --pos: #1d7a4b; --neg: #c0262d; --chip: #e4ecf1; --sky1: #cfe6f5; --sky2: #eef5ea;
  --f-display: 'Black Han Sans', 'IBM Plex Sans KR', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans KR', system-ui, -apple-system, sans-serif;
  --f-num: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #091119; --panel: #101b26; --panel-2: #0d1720; --ink: #dce6ee; --muted: #8b9cab; --line: #213140;
  --sea: #0c2131; --land: #1b2520; --land-edge: #34453b; --river: #3f80b8; --lane: #3a566a;
  --brand: #5aa6ea; --brand-ink: #071019; --accent: #f2b705; --mine: #ff7a33;
  --pos: #4cc38a; --neg: #ff6b6b; --chip: #182735; --sky1: #0d1a2e; --sky2: #1c2a3a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #091119; --panel: #101b26; --panel-2: #0d1720; --ink: #dce6ee; --muted: #8b9cab; --line: #213140;
  --sea: #0c2131; --land: #1b2520; --land-edge: #34453b; --river: #3f80b8; --lane: #3a566a;
  --brand: #5aa6ea; --brand-ink: #071019; --accent: #f2b705; --mine: #ff7a33;
  --pos: #4cc38a; --neg: #ff6b6b; --chip: #182735; --sky1: #0d1a2e; --sky2: #1c2a3a; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .muted { color: var(--muted); }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.logo { font-family: var(--f-display); font-size: 22px; letter-spacing: 0.02em; display: flex; align-items: center; gap: 8px; }
.flags { display: inline-grid; grid-template-columns: 8px 8px; grid-template-rows: 8px 8px; }
.flags i:nth-child(1) { background: var(--accent); } .flags i:nth-child(2) { background: var(--brand); }
.flags i:nth-child(3) { background: var(--brand); } .flags i:nth-child(4) { background: var(--accent); }
.co { font-size: 12px; color: var(--muted); }
.date { margin-left: auto; font-family: var(--f-num); font-weight: 600; }
.ctl { display: flex; gap: 6px; }
.ctl button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 6px 10px; min-width: 40px; font-weight: 600; }
.ctl button.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.stats { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1.15fr) minmax(0, 0.9fr) minmax(0, 0.9fr); gap: 8px; margin-top: 8px; }
.stat { min-width: 0; }
.stat small { display: block; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
.stat b { display: block; font-family: var(--f-num); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); }
.mapbox { position: relative; height: 50vh; min-height: 260px; max-height: 520px; background: var(--sea); border-bottom: 1px solid var(--line); }
.p3 { position: absolute; inset: 0; background: linear-gradient(180deg, var(--sky1), var(--sky2)); overflow: hidden; }
.p3c { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.p3o { position: absolute; inset: 0; pointer-events: none; }
.p3lab { position: absolute; left: 0; top: 0; pointer-events: auto; border: 0; background: var(--panel); color: var(--ink); font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; box-shadow: 0 2px 8px rgb(0 0 0 / 0.18); white-space: nowrap; }
.p3lab:hover { background: var(--accent); color: #1b1400; }
.p3lab .bang { display: inline-grid; place-items: center; min-width: 17px; height: 17px; margin-left: 3px; border-radius: 9px; background: var(--accent); color: #1b1400; font-size: 11px; font-family: var(--f-num); }
.p3bub, .p3tag { position: absolute; left: 0; top: 0; background: #fffdf7; color: #22221f; border: 1.5px solid #2b2420; border-radius: 10px; padding: 4px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
.p3bub::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 8px; height: 8px; background: #fffdf7; border-right: 1.5px solid #2b2420; border-bottom: 1.5px solid #2b2420; transform: translateX(-50%) rotate(45deg); }
.p3tag { background: var(--mine); color: #fff; border-color: transparent; }
.p3chip { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 10px; right: 12px; font-size: 11.5px; color: var(--muted); pointer-events: none; text-shadow: 0 1px 0 var(--sky2); }
.p3chip b { color: var(--ink); font-size: 13px; }
.p3more { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 10px; background: var(--mine); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
#map { width: 100%; height: 100%; display: block; touch-action: manipulation; }
.mapctl { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 10px; display: flex; gap: 4px; }
.mapctl button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600; }
.mapctl button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.legend { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 10px; display: flex; gap: 10px; font-size: 11px; color: var(--muted);
  background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 3px 8px; border-radius: 6px; }
.legend[hidden] { display: none; }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--river); vertical-align: middle; margin-right: 4px; }
.legend span.c::before { border-top: 1.5px dashed var(--lane); }
.legend span.s::before { width: 10px; height: 6px; border: 0; background: var(--mine); clip-path: polygon(0 0, 70% 0, 100% 50%, 70% 100%, 0 100%); }

.side { min-width: 0; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs button { border: 0; background: none; padding: 11px 4px 9px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; position: relative; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .dot { position: absolute; top: 7px; margin-left: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--mine); }
#panel { padding-block: 14px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }

@media (min-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1.2fr) minmax(380px, 1fr); }
  .mapbox { position: sticky; top: 108px; height: calc(100vh - 108px); max-height: none; border-bottom: 0; border-right: 1px solid var(--line); }
  .tabs { position: sticky; top: 108px; z-index: 4; }
}

h2 { font-size: 18px; margin: 0; text-wrap: balance; }
h3 { font-size: 13px; margin: 0 0 8px; color: var(--muted); letter-spacing: 0.05em; font-weight: 600; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
.hint { background: color-mix(in srgb, var(--accent) 14%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.hint ol { margin: 4px 0 0; padding-left: 18px; }

.list { display: grid; gap: 8px; }
.shipcard { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; text-align: left;
  border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px; width: 100%; }
.shipcard:hover { border-color: var(--brand); }
.shipcard .nm { font-weight: 700; }
.shipcard small { color: var(--muted); font-size: 12px; display: block; }
.shipcard .st { font-size: 12px; text-align: right; }
.shipcard .bar { grid-column: 2 / 4; }
.glyph { width: 12px; height: 12px; border-radius: 3px; background: var(--mine); }
.glyph.fish { background: var(--brand); } .glyph.tour { background: var(--accent); } .glyph.bunker { background: var(--ink); }
.bar { height: 4px; background: var(--chip); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand); }
.bar.fuel i { background: var(--mine); }
.bars { grid-column: 2 / 4; display: grid; gap: 3px; }
.wx { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.wx.w0 { background: color-mix(in srgb, var(--accent) 20%, var(--panel)); color: var(--ink); }
.wx.w2 { background: color-mix(in srgb, var(--mine) 22%, var(--panel)); color: var(--ink); }
.wx.w3 { background: var(--neg); color: #fff; }
.costs { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.net { font-family: var(--f-num); font-weight: 700; font-size: 13.5px; }
.net small { font-weight: 500; font-size: 11.5px; }
.route small { font-weight: 500; color: var(--muted); margin-left: 4px; }
.dest.has { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }

.dhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.back { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 10px; font-size: 13px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.kv div small { display: block; color: var(--muted); font-size: 11px; }
.kv div b { font-family: var(--f-num); font-size: 14px; }
.status { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--panel-2); }

.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tblwrap { overflow-x: auto; }
.tbl th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl tr:last-child td { border-bottom: 0; }
.gname { font-weight: 600; white-space: nowrap; }
.tag { display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 999px; background: var(--chip); color: var(--muted); margin-left: 4px; white-space: nowrap; font-weight: 500; }
.tag.p { background: color-mix(in srgb, var(--pos) 16%, var(--panel)); color: var(--pos); }
.tag.d { background: color-mix(in srgb, var(--neg) 14%, var(--panel)); color: var(--neg); }
.tag.a { background: color-mix(in srgb, var(--accent) 22%, var(--panel)); color: var(--ink); }
.best { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
.acts { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 5px 9px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.btn.pri { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.warn { border-color: var(--neg); color: var(--neg); background: var(--panel); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.wide { width: 100%; padding: 9px; font-size: 14px; }

.dest { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; width: 100%; text-align: left;
  border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 10px; }
.dest:hover { border-color: var(--brand); }
.dest b { font-weight: 700; } .dest small { color: var(--muted); font-size: 12px; }
.dest em { font-style: normal; font-family: var(--f-num); font-weight: 600; font-size: 13px; text-align: right; }
.dests { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }

.con { display: grid; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; background: var(--panel); }
.con .l1 { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.con .route { font-weight: 700; }
.con .pay { font-family: var(--f-num); font-weight: 600; color: var(--pos); }
.con small { color: var(--muted); font-size: 12px; }

.yard { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.ycard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel); display: grid; gap: 6px; }
.ycard.locked { opacity: 0.55; }
.ycard .t { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.ycard .t b { font-size: 15px; }
.ycard dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; font-size: 12px; }
.ycard dt { color: var(--muted); } .ycard dd { margin: 0; font-family: var(--f-num); text-align: right; }

.rank { display: grid; gap: 8px; }
.rrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
.rrow .pl { font-family: var(--f-display); font-size: 18px; color: var(--muted); }
.rrow.me .pl, .rrow.me .nm { color: var(--mine); }
.rrow .nm { font-weight: 700; }
.rrow .bar { grid-column: 2 / 4; height: 6px; }
.rrow.me .bar i { background: var(--mine); }
.news { display: grid; gap: 4px; font-size: 12.5px; max-height: 260px; overflow-y: auto; }
.news div { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; }
.news span { color: var(--muted); font-family: var(--f-num); font-size: 11.5px; }
.prog { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; margin: 6px 0 4px; }
.prog i { display: block; height: 100%; background: var(--accent); }
.chart svg { width: 100%; height: auto; display: block; }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select, input[type=text] { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); max-width: 100%; }
label.chk { display: flex; gap: 8px; align-items: center; font-size: 13px; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: grid; gap: 6px; width: min(92vw, 420px); pointer-events: none; }
#toast div { background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 10px; font-size: 13px; box-shadow: 0 6px 20px rgb(0 0 0 / 0.18); animation: tin 0.2s ease-out; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
#modal { position: fixed; inset: 0; z-index: 40; background: rgb(5 12 20 / 0.3); display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
#modal[hidden] { display: none; }
.mbox { background: var(--panel); border-radius: 14px; padding: 20px; width: min(100%, 460px); max-height: 92vh; overflow-y: auto; display: grid; gap: 12px; border: 1px solid var(--line); }
.mbox h1 { font-family: var(--f-display); font-size: 34px; margin: 0; font-weight: 400; letter-spacing: 0.01em; }
.mbox p { margin: 0; color: var(--muted); }
.starts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.starts button { text-align: left; border: 2px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 10px; display: grid; gap: 2px; }
.starts button.on { border-color: var(--brand); }
.starts button b { font-size: 15px; } .starts button small { color: var(--muted); font-size: 12px; }

/* map */
#map .land { fill: var(--land); stroke: var(--land-edge); stroke-width: 1; vector-effect: non-scaling-stroke; }
#map .river { stroke: var(--river); stroke-width: 2.2; fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; }
#map .lane { stroke: var(--lane); stroke-width: 1; fill: none; stroke-dasharray: 3 4; vector-effect: non-scaling-stroke; opacity: 0.8; }
#map .lane.n { stroke-dasharray: 6 5; }
#map .lane.off { opacity: 0.25; }
#map .port { fill: var(--panel); stroke: var(--ink); stroke-width: 1.4; vector-effect: non-scaling-stroke; cursor: pointer; }
#map .port.big { fill: var(--ink); }
#map .port.sel { stroke: var(--accent); stroke-width: 3; }
#map .lock { opacity: 0.3; }
#map text { font-family: var(--f-body); fill: var(--ink); paint-order: stroke; stroke: var(--sea); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; font-weight: 600; }
#map text.sea { fill: var(--muted); font-weight: 500; letter-spacing: 0.2em; stroke: none; }
#map .badge { fill: var(--mine); }
#map text.bt { fill: #fff; stroke: none; font-family: var(--f-num); font-weight: 600; }
#map .ship { fill: var(--mine); stroke: var(--panel); stroke-width: 1; vector-effect: non-scaling-stroke; cursor: pointer; }
#map .ship.sel { stroke: var(--accent); stroke-width: 2.5; }
#map .route { stroke: var(--accent); stroke-width: 2.5; fill: none; vector-effect: non-scaling-stroke; stroke-dasharray: 6 4; }
#map .hit { fill: transparent; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { #toast div { animation: none; } }
</style>

<header class="top">
  <div class="top-row">
    <div class="logo"><span class="flags" aria-hidden="true"><i></i><i></i><i></i><i></i></span>선박왕</div>
    <div class="co" id="coName"></div>
    <div class="date" id="date">1955.01.01</div>
    <div class="ctl">
      <button id="bPlay" data-act="play" aria-label="재생/일시정지">▶</button>
      <button id="bSpeed" data-act="speed" aria-label="속도">1×</button>
      <button data-act="step" aria-label="하루 진행">+1일</button>
      <button id="bSnd" data-act="snd" aria-label="소리 켜기/끄기">♪</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><small>현금</small><b id="sCash">-</b></div>
    <div class="stat"><small>순자산</small><b id="sNet">-</b></div>
    <div class="stat"><small>운임지수</small><b id="sIdx">-</b></div>
    <div class="stat"><small>기름값</small><b id="sOil">-</b></div>
  </div>
</header>

<div class="layout">
  <div class="mapbox">
    <svg id="map" role="img" aria-label="항구와 항로 지도"></svg>
    <div id="p3" class="p3" hidden></div>
    <div class="mapctl"><button data-act="view" data-v="port3d" id="vP3">항구</button><button data-act="view" data-v="kr" id="vKr">국내</button><button data-act="view" data-v="nea" id="vNea">동북아</button></div>
    <div class="legend" id="legend"><span>강 항로</span><span class="c">바닷길</span><span class="s">내 배</span></div>
  </div>
  <div class="side">
    <nav class="tabs" id="tabs">
      <button data-act="tab" data-t="fleet">선단</button>
      <button data-act="tab" data-t="port">항구</button>
      <button data-act="tab" data-t="cons">계약</button>
      <button data-act="tab" data-t="yard">조선소</button>
      <button data-act="tab" data-t="rank">순위</button>
    </nav>
    <main id="panel"></main>
  </div>
</div>
<div id="toast" aria-live="polite"></div>
<div id="modal" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
'use strict';
/* ================= DATA ================= */

const proj = (lat, lon) => [(lon - 119.5) * 80.9, (40.5 - lat) * 100];
function hav(a, b) {
  const R = 6371, t = Math.PI / 180, dLa = (b.lat - a.lat) * t, dLo = (b.lon - a.lon) * t;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function dateOf(d) { return new Date(Date.UTC(START_YEAR, 0, 1) + d * 864e5); }
function dateStr(d) { const t = dateOf(d); return `${t.getUTCFullYear()}.${String(t.getUTCMonth() + 1).padStart(2, '0')}.${String(t.getUTCDate()).padStart(2, '0')}`; }

function okEdge(t, c) { return t === 'r' ? c.river : t === 'c' ? c.range >= 1 : (c.range >= 2 && S.era >= 3); }
function routes(from, c) {
  const dist = { [from]: 0 }, prev = {}, done = new Set();
  for (;;) {
    let u = null, best = Infinity;
    for (const k in dist) if (!done.has(k) && dist[k] < best) { best = dist[k]; u = k; }
    if (u === null) break;
    done.add(u);
    for (const e of ADJ[u] || []) {
      if (!okEdge(e.t, c)) continue;
      if (PORTS[e.to] && !portOpen(e.to)) continue;
      const nd = best + e.d;
      if (dist[e.to] === undefined || nd < dist[e.to]) { dist[e.to] = nd; prev[e.to] = u; }
    }
  }
  return { dist, prev };
}
function pathOf(R, to) { const p = []; for (let n = to; n !== undefined; n = R.prev[n]) p.unshift(n); return p; }

  const area = t === 'r' ? 'river' : t === 'n' ? 'near' : lo < 126.9 ? 'west' : (la < 35.25 && lo < 129.25) ? 'south' : 'east';
  EDGE_AREA[a + '|' + b] = EDGE_AREA[b + '|' + a] = area;
}
function portArea(pid) { const e = (ADJ[pid] || []).find(e => e.t !== 'r') || ADJ[pid][0]; return EDGE_AREA[pid + '|' + e.to]; }
function season(m) { return (m === 11 || m <= 1) ? 'winter' : (m >= 6 && m <= 8) ? 'summer' : 'mild'; }
function wxProbs(area, m) {
  const sz = season(m);
  if (area === 'river') return sz === 'summer' ? [0.7, 0.25, 0.05, 0] : [0.85, 0.15, 0, 0];
  if (sz === 'winter') return area === 'south' ? [0.6, 0.25, 0.15, 0] : [0.45, 0.25, 0.3, 0];
  if (sz === 'summer') return area === 'near' || area === 'south' ? [0.5, 0.25, 0.13, 0.12] : [0.55, 0.25, 0.13, 0.07];
  return [0.7, 0.22, 0.08, 0];
}
function nextWx(area, prev, day) {
  const m = dateOf(day).getUTCMonth(), p = wxProbs(area, m);
  if (prev === 3 && Math.random() < 0.55) return 3;
  if (prev > 0 && Math.random() < 0.5 && p[prev] > 0) return prev;
  let r = Math.random(); for (let i = 0; i < 4; i++) { if (r < p[i]) return i; r -= p[i]; } return 0;
}

function fuelPrice(pid) {

  if ((ADJ[pid] || []).every(e => e.t === 'r')) m = 1.15;
  if ((pid === 'ulsan' || pid === 'yeosu') && S.era >= 2) m = 0.82;
  if (P.era === 3) m = 1.05;
  return BASE_FUEL * oilLevel() * m;
}
function oilLevel() { return S.oil + S.oilShock; }
// 외상(운영자금) 한도: 선박 가치의 30%까지 연료를 외상으로 살 수 있다
function creditLine() { return S.ships.reduce((a, sh) => a + shipValue(sh), 0) * 0.3; }
const portFee = t => Math.round(5 + t.cap * 0.4);
const wage = sh => T(sh).wage * (1 + 0.03 * sh.age / 365) * (sh.mode === 'layup' ? 0.25 : 1);
const fullWage = sh => T(sh).wage * (1 + 0.03 * sh.age / 365);
function load(sh) { let u = 0; for (const c of sh.cons) u += c.q; for (const g in sh.cargo) u += sh.cargo[g].q; return u; }
const freeCap = sh => T(sh).cap - load(sh);
function typeCarries(t, g) { return !!t.cls && t.cls.includes(GOODS[g].cls); }
const canCarry = (sh, g) => typeCarries(T(sh), g);
const priceMul = () => 0.85 + 0.15 * S.idx;
const newPrice = t => t.price * priceMul();
function shipValue(sh) { return T(sh).price * Math.max(0.1, 1 - sh.age / 365 / 35) * priceMul() * 0.9; }
const usedPrice = L => SHIPS[L.type].price * Math.max(0.1, 1 - L.age / 35) * priceMul();
function netWorth() { let v = S.cash; for (const sh of S.ships) v += shipValue(sh) + (sh.fuel || 0) * BASE_FUEL * oilLevel(); for (const o of S.orders) v += o.paid * 0.8; return v; }
function rankList() {
  const arr = [{ name: S.name, w: netWorth(), me: true }, ...S.rivals.map(r => ({ name: r.name, w: r.w }))];
  return arr.sort((a, b) => b.w - a.w);
}
const myRank = () => rankList().findIndex(r => r.me) + 1;

/* ---- voyage planning: simulate day by day on the forecast ---- */
function segsOf(path) {
  const segs = []; let at = 0;
  for (let i = 1; i < path.length; i++) { const e = ADJ[path[i - 1]].find(e => e.to === path[i]); segs.push({ from: at, to: at + e.d, area: EDGE_AREA[path[i - 1] + '|' + path[i]] }); at += e.d; }
  return segs;
}
const areaAt = (segs, km) => (segs.find(s => km < s.to) || segs[segs.length - 1]).area;
function dayStep(t, area, k, laden) {
  const w = wxNow(area, k);
  const spd = t.speed * (t.sail ? WX_SAIL[w] : WX_SPD[w]);
  const fuel = t.burn * WX_FUEL[w] * (laden ? 1 : 0.8);
  return { spd, fuel, w };
}
function plan(sh, to, extraQ = 0) {
  const t = T(sh), R = routes(sh.loc, t);
  if (R.dist[to] === undefined) return null;
  const path = pathOf(R, to), segs = segsOf(path), dist = R.dist[to];
  const laden = load(sh) + extraQ > 0;
  let done = 0, d = 0, fuel = 0, worst = 0;
  while (done < dist && d < 60) { const st = dayStep(t, areaAt(segs, done), d, laden); done += st.spd; fuel += st.fuel; worst = Math.max(worst, st.w); d++; }
  const fp = fuelPrice(sh.loc);
  const cost = fuel * fp + fullWage(sh) * d + portFee(t);
  return { path, segs, dist, days: d, fuel, worst, cost, fuelCost: fuel * fp };
}
function jobNet(sh, c) {
  const p = plan(sh, c.to, c.q); if (!p) return null;
  const pay = c.pay;
  return { ...p, pay, net: pay - p.cost, perDay: (pay - p.cost) / p.days };
}

function news(t) { S.news.unshift({ d: S.day, t }); if (S.news.length > 60) S.news.length = 60; }
function toast(t) {
  const box = $('#toast'), el = document.createElement('div');
  el.textContent = t; box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 2800);
}

/* ================= GAME SETUP ================= */
function newGame(name, home) {
  S = {
    v: 2, name: name || '한국해운', home, day: 0, cash: 800, era: 1, idx: 1, shock: 0, phase: Math.random() * 6.28, oil: 1, oilShock: 0,
    ships: [], seq: {}, sid: 1, contracts: [], cid: 1, used: [], orders: [], events: [], wx: {},
    rivals: RIVALS.map(r => ({ ...r })), news: [], hist: [], won: false, over: false, autoPause: true, tip: true,
  };
  for (const a in AREAS) { S.wx[a] = [0]; S.wx[a].push(nextWx(a, 0, 1)); S.wx[a].push(nextWx(a, S.wx[a][1], 2)); }
  addShip('ttak', home, 0);
  refreshUsed();
  for (let i = 0; i < 12; i++) genContract();
  for (let i = 0; i < 3; i++) genContract(home, 'ttak');
  news(`${S.name} 창업. ${PORTS[home].name} 나루에서 똑딱선 한 척으로 운송업을 시작합니다.`);
  S.hist.push(histPoint());
  UI.port = home; UI.ship = null; UI.tab = 'fleet'; UI.t = 0; UI.view = P3.ok ? 'port3d' : 'kr';
}
function addShip(type, loc, ageDays) {
  const t = SHIPS[type]; S.seq[type] = (S.seq[type] || 0) + 1;
  const sh = { id: S.sid++, type, name: `${t.short} ${S.seq[type]}호`, age: ageDays || 0, loc, voy: null, cargo: {}, cons: [], mode: 'idle', busy: 0, fuel: t.tank, earn: 0, spend: 0 };
  S.ships.push(sh); return sh;
}
function deliveryPort(t) { return t.river ? S.home : (S.home === 'mapo' ? 'incheon' : 'busan'); }
function refreshUsed() {
  const types = Object.keys(SHIPS).filter(k => SHIPS[k].era <= S.era);
  S.used = [];
  for (let i = 0; i < 4; i++) {
    const type = pick(types), t = SHIPS[type];
    const ports = Object.keys(PORTS).filter(p => portOpen(p) && (ADJ[p] || []).some(e => okEdge(e.t, t)));
    if (!ports.length) continue;
    S.used.push({ type, age: rint(3, 25), loc: pick(ports), id: Math.random().toString(36).slice(2, 8) });
  }
}
// 운송 의뢰: 어떤 크기의 배가 실을 만한지 먼저 정하고, 그 배가 갈 수 있는 목적지를 고른다
function genContract(forceFrom, forceType) {
  const open = Object.keys(PORTS).filter(portOpen);
  const cargoTypes = Object.entries(SHIPS).filter(([k, t]) => t.role === 'cargo' && t.era <= S.era);
  for (let tries = 0; tries < 10; tries++) {
    const [tk, t] = forceType ? [forceType, SHIPS[forceType]] : cargoTypes[Math.floor(Math.pow(Math.random(), 1.6) * cargoTypes.length)];
    const starts = open.filter(p => (ADJ[p] || []).some(e => okEdge(e.t, t)));
    const from = forceFrom || pick(starts.flatMap(p => Array(PORTS[p].size).fill(p)));
    const P = PORTS[from];
    const gs = Object.keys(GOODS).filter(g => goodOpen(g) && typeCarries(t, g));
    if (!gs.length) continue;
    const prod = P.prod.filter(g => gs.includes(g));
    const g = prod.length && Math.random() < 0.7 ? pick(prod) : pick(gs);
    const R = routes(from, t);
    const cands = open.filter(p => p !== from && R.dist[p] !== undefined);
    if (!cands.length) continue;
    const dem = cands.filter(p => PORTS[p].dem.includes(g));
    const to = dem.length && Math.random() < 0.75 ? pick(dem) : pick(cands);
    const km = R.dist[to];
    const q = Math.max(3, Math.round(t.cap * rnd(0.35, 1)));
    const boom = S.events.some(e => e.port === from) ? 1.4 : 1;
    const pay = Math.round(q * GOODS[g].rate * (14 + 0.06 * km) * S.idx * boom * rnd(0.85, 1.2) / 5) * 5;
    const due = Math.ceil(km / (t.speed * 0.75)) + (GOODS[g].fresh ? 1 : 4);
    S.contracts.push({ id: S.cid++, from, to, good: g, q, km: Math.round(km), pay, due, offer: S.day + rint(5, 11), size: tk });
    return;
  }
}

/* ================= ACTIONS ================= */
function doRefuel(sh, frac) {
  const t = T(sh), want = Math.max(0, t.tank * frac - sh.fuel), price = fuelPrice(sh.loc);
  const q = Math.min(want, Math.max(0, S.cash + creditLine()) / price);
  if (q <= 0.001) { toast('현금과 외상 한도가 모두 바닥났습니다. 배를 팔거나 계선하세요'); return; }
  S.cash -= q * price; sh.fuel += q; sh.spend += q * price;
  toast(`${sh.name} 연료 ${q.toFixed(2)}t 보충 ${won(q * price)}`); SND.play('click');
}
function doLoad(cid, sh) {
  const i = S.contracts.findIndex(c => c.id === cid); if (i < 0) return;
  const c = S.contracts[i];
  if (sh.loc !== c.from || freeCap(sh) < c.q || !canCarry(sh, c.good)) return;
  S.contracts.splice(i, 1);
  sh.cons.push({ ...c, deadline: S.day + c.due });
  SND.play('click'); toast(`${GOODS[c.good].name} ${c.q}t 선적 → ${PORTS[c.to].name} · 운임 ${won(c.pay)}`);
}
function doUnload(cid, sh) {
  const i = sh.cons.findIndex(c => c.id === cid); if (i < 0 || sh.voy) return;
  const [c] = sh.cons.splice(i, 1);
  if (c.offer >= S.day) S.contracts.push(c);
  toast(`${GOODS[c.good].name} ${c.q}t 하역 (의뢰 반납)`);
}
function doSail(sh, to) {
  const p = plan(sh, to); if (!p) return;
  if (T(sh).burn && sh.fuel + 1e-6 < p.fuel) { toast(`연료가 모자랍니다. 예상 ${p.fuel.toFixed(2)}t 필요, 남은 연료 ${sh.fuel.toFixed(2)}t`); return; }
  S.cash -= portFee(T(sh)); sh.spend += portFee(T(sh));
  sh.voy = { from: sh.loc, to, path: p.path, segs: p.segs, dist: p.dist, done: 0, dep: S.day, next: 0, eta: p.days };
  sh.voy.next = dayStep(T(sh), areaAt(p.segs, 0), 0, load(sh) > 0).spd;
  sh.loc = null; sh.mode = 'idle'; UI.confirm = null;
  toast(`${sh.name} 출항 → ${PORTS[to].name} (예상 ${p.days}일)`); SND.play('horn');
  if (!UI.playing) setPlaying(true);
}
function doFish(sh) {
  const need = T(sh).burn * 3 * WX_FUEL[wxNow(portArea(sh.loc))];
  if (sh.fuel < need) { toast('조업 나갈 연료가 모자랍니다'); return; }
  sh.mode = 'fishing'; sh.busy = S.day + 3;
  toast(`${sh.name} 조업 출항 (3일)`); SND.play('horn');
  if (!UI.playing) setPlaying(true);
}
function doLayup(sh) { sh.mode = 'layup'; toast(`${sh.name} 계선(휴업). 고정비가 ${won(fullWage(sh))} → ${won(wage(sh))}/일로 줄어듭니다`); }
function doReactivate(sh) {
  const fee = fullWage(sh) * 5; S.cash -= fee; sh.spend += fee; sh.mode = 'react'; sh.busy = S.day + 2;
  toast(`${sh.name} 재가동 시작 · ${won(fee)} · 2일 뒤 운항 가능`);
}
function doOrder(type) {
  const t = SHIPS[type], cost = newPrice(t);
  if (S.cash < cost) return;
  S.cash -= cost;
  S.orders.push({ type, ready: S.day + t.build, port: deliveryPort(t), paid: cost });
  toast(`${t.name} 발주 완료. ${t.build}일 뒤 ${PORTS[deliveryPort(t)].name}에서 인도`); SND.play('click');
}
function doBuyUsed(id) {
  const i = S.used.findIndex(u => u.id === id); if (i < 0) return;
  const L = S.used[i], cost = usedPrice(L);
  if (S.cash < cost) return;
  S.cash -= cost; S.used.splice(i, 1);
  const sh = addShip(L.type, L.loc, L.age * 365); sh.fuel = SHIPS[L.type].tank * 0.3;
  toast(`${sh.name} 매입 (${L.age}년 된 중고선, ${PORTS[L.loc].name})`);
}
function doSellShip(sh) {
  const v = shipValue(sh);
  S.cash += v; S.ships = S.ships.filter(x => x !== sh);
  toast(`${sh.name} 매각 ${won(v)}`); UI.ship = null; UI.confirm = null;
}

/* ================= DAILY TICK ================= */
function histPoint() { return { d: S.day, me: netWorth(), r: S.rivals.map(r => r.w) }; }
function voyProg(sh) { const v = sh.voy; return clamp((v.done + v.next * clamp(UI.t - S.day, 0, 1)) / v.dist, 0, 1); }
function tick() {
  S.day++;
  // weather: shift the 3-day forecast
  for (const a in S.wx) {
    const w = S.wx[a], before = w[0]; w.shift(); w.push(nextWx(a, w[w.length - 1], S.day + 2));
    if (w[0] === 3 && before !== 3 && a !== 'river') news(`${AREAS[a]}에 태풍 — 항해 중인 배가 느려지고 연료를 많이 씁니다`);
  }
  // markets: freight index (2-year cycle) and oil price (random walk + rare shocks)
  S.shock = S.shock * 0.97 + gauss() * 0.025;
  S.idx = clamp(1 + 0.3 * Math.sin(2 * Math.PI * S.day / 720 + S.phase) + S.shock, 0.55, 1.6);
  S.oilShock *= 0.985;
  if (S.era >= 2 && Math.random() < 0.0015) { S.oilShock += 0.8; news('중동 정세 불안 — 국제 유가 급등'); toast('유가 급등! 기름값이 크게 올랐습니다'); }
  S.oil = clamp(S.oil + (1 - S.oil) * 0.02 + gauss() * 0.018, 0.6, 1.6);
  S.events = S.events.filter(e => e.until > S.day);
  if (Math.random() < 0.02) {
    const p = pick(Object.keys(PORTS).filter(portOpen));
    S.events.push({ port: p, until: S.day + rint(12, 25) });
    news(`${PORTS[p].name} 물동량 급증 — 그 항구에서 나가는 운임이 오릅니다`);
  }
  // ships
  const tourCount = {}, bunkCount = {};
  for (const sh of S.ships) if (sh.loc && sh.mode === 'tour') tourCount[sh.loc] = (tourCount[sh.loc] || 0) + 1;
  for (const sh of S.ships) if (sh.loc && sh.mode === 'bunker') bunkCount[sh.loc] = (bunkCount[sh.loc] || 0) + 1;
  let arrived = false;
  for (const sh of S.ships) {
    const t = T(sh);
    sh.age++;
    S.cash -= wage(sh); sh.spend += wage(sh);
    if (sh.loc && sh.mode === 'tour') { const v = (PORTS[sh.loc].tour || 0) * 60 * (0.7 + 0.3 * S.idx) / tourCount[sh.loc]; S.cash += v; sh.earn += v; }
    if (sh.loc && sh.mode === 'bunker') { const v = (PORTS[sh.loc].traffic || 0) * 260 * S.idx * oilLevel() / bunkCount[sh.loc]; S.cash += v; sh.earn += v; }
    if (sh.mode === 'react' && S.day >= sh.busy) { sh.mode = 'idle'; news(`${sh.name} 재가동 완료`); }
    if (sh.mode === 'fishing') {
      sh.fuel = Math.max(0, sh.fuel - t.burn * WX_FUEL[wxNow(portArea(sh.loc))]);
      if (S.day >= sh.busy) {
        const q = rint(4, 8), rev = q * 70 * rnd(0.85, 1.2) * (0.85 + 0.15 * S.idx);
        S.cash += rev; sh.earn += rev; sh.mode = 'idle';
        news(`${sh.name} 조업 귀항 — 생선 ${q}t 위판 ${won(rev)}`); toast(`${sh.name} 귀항: 생선 ${q}t → ${won(rev)}`); SND.play('coin');
        arrived = true;
      }
    }
    if (sh.voy) {
      const v = sh.voy, st = dayStep(t, areaAt(v.segs, v.done), 0, load(sh) > 0);
      let spd = st.spd;
      if (t.burn) {
        if (sh.fuel < st.fuel) {
          const tow = st.fuel * fuelPrice(v.to) * 4 + fullWage(sh) * 3;
          S.cash -= tow; sh.spend += tow; sh.fuel = st.fuel; spd *= 0.4;
          news(`${sh.name} 연료 고갈 — 긴급 급유·예인 ${won(tow)}`); toast(`${sh.name} 연료 고갈! 긴급 급유 비용 ${won(tow)}`);
        }
        sh.fuel = Math.max(0, sh.fuel - st.fuel);
      }
      if (st.w === 3 && Math.random() < 0.06) { const dmg = t.price * 0.02; S.cash -= dmg; sh.spend += dmg; news(`${sh.name} 태풍 피해 — 수리비 ${won(dmg)}`); }
      v.done += spd;
      if (v.done >= v.dist) {
        sh.loc = v.to; sh.voy = null;
        let msg = `${sh.name} ${PORTS[sh.loc].name} 도착`, got = 0;
        const keep = [];
        for (const c of sh.cons) {
          if (c.to === sh.loc) { const late = S.day > c.deadline, pay = late ? c.pay / 2 : c.pay; S.cash += pay; sh.earn += pay; got += pay; if (late) msg += ' · 기한 초과로 운임 절반'; }
          else keep.push(c);
        }
        sh.cons = keep;
        if (got) { msg += ` · 운임 ${won(got)}`; SND.play('coin'); } else SND.play('bell');
        news(msg); toast(msg); arrived = true;
      } else v.next = dayStep(t, areaAt(v.segs, v.done), 1, load(sh) > 0).spd;
    }
  }
  if (S.cash < 0) S.cash *= 1.001;
  for (const o of S.orders.filter(o => o.ready <= S.day)) {
    const sh = addShip(o.type, o.port, 0);
    news(`신조선 ${sh.name} 인도 (${PORTS[o.port].name})`); toast(`신조선 ${sh.name} 인도!`);
  }
  S.orders = S.orders.filter(o => o.ready > S.day);
  // freight jobs: expire, rivals take some, new ones appear
  S.contracts = S.contracts.filter(c => {
    if (c.offer < S.day) return false;
    if (Math.random() < 0.03) { const r = pick(S.rivals); if (Math.random() < 0.3) news(`${r.name}이(가) ${PORTS[c.from].name}→${PORTS[c.to].name} ${GOODS[c.good].name} 화물을 가져갔습니다`); return false; }
    return true;
  });
  const growth = Math.min(2.5, 1 + S.day / 500); // 경제 성장으로 물동량이 늘어난다
  const want = [0, 34, 60, 90][S.era] * growth;
  for (let k = 0; k < [0, 7, 11, 15][S.era] * growth; k++) if (S.contracts.length < want && Math.random() < 0.8) genContract();
  // keep a little work around wherever my ships wait
  for (const sh of S.ships) if (sh.loc && !sh.voy && T(sh).role === 'cargo' && Math.random() < 0.5 && !S.contracts.some(c => c.from === sh.loc && c.q <= T(sh).cap && canCarry(sh, c.good))) genContract(sh.loc, sh.type);
  if (S.day % 30 === 0) refreshUsed();
  for (const r of S.rivals) {
    const g = 0.024 * Math.pow(5000 / r.w, 0.3) * r.k * (1 + r.sens * (S.idx - 1)) - 0.004 * (oilLevel() - 1) + gauss() * r.noise;
    r.w = Math.max(500, r.w * (1 + g));
  }
  const nw = netWorth();
  if (S.era < 3 && nw >= ERA[S.era + 1].need) {
    S.era++; SND.play('fanfare');
    news(`${ERA[S.era].name} 개막`);
    for (const p in PORTS) if (PORTS[p].era === S.era) news(`${PORTS[p].name} 항로 개설`);
    refreshUsed(); setPlaying(false); eraModal();
  }
  if (S.day % 5 === 0) { S.hist.push(histPoint()); if (S.hist.length > 500) S.hist.splice(0, S.hist.length - 500); }
  if (!S.won && nw >= GOAL && myRank() === 1) { S.won = true; setPlaying(false); winModal(); }
  if (nw < 0 && !S.over) { S.over = true; setPlaying(false); overModal(); }
  if (arrived && S.autoPause) setPlaying(false);
  if (S.day % 5 === 0) save();
}

/* ================= MAP ================= */
const VIEWS = { kr: [490, 236, 362, 518], nea: [30, 80, 1300, 900] };
function landPath(poly) { return 'M' + poly.map(([la, lo]) => proj(la, lo).map(v => v.toFixed(1)).join(',')).join('L') + 'Z'; }
function drawMap() {
  const in3d = UI.view === 'port3d' && P3.ok && p3Ready;
  $('#map').style.visibility = in3d ? 'hidden' : 'visible';
  $('#legend').hidden = in3d;
  if (in3d) { P3.show(); return; }
  P3.hide();
  if (UI.view === 'port3d') UI.view = 'kr';
  const svg = $('#map'), vb = VIEWS[UI.view];
  svg.setAttribute('viewBox', vb.join(' '));
  const r = svg.getBoundingClientRect();
  UI.upp = r.width ? Math.max(vb[2] / r.width, vb[3] / r.height) : 1;
  const u = UI.upp, fs = 11.5 * u;
  let h = `<rect x="-200" y="-200" width="1800" height="1500" fill="var(--sea)"/>`;
  for (const poly of LAND) h += `<path class="land" d="${landPath(poly)}"/>`;
  for (const [la, lo, rx, ry] of ISLES) { const [x, y] = proj(la, lo); h += `<ellipse class="land" cx="${x}" cy="${y}" rx="${rx * 80.9}" ry="${ry * 100}"/>`; }
  const seaLab = UI.view === 'kr' ? [['서 해', 36.3, 125.7], ['남 해', 34.05, 127.9], ['동 해', 37.0, 129.85]] : [['황 해', 35.2, 123.4], ['동 해', 38.5, 131.5], ['동중국해', 31.0, 124.6]];
  for (const [t, la, lo] of seaLab) { const [x, y] = proj(la, lo); h += `<text class="sea" x="${x}" y="${y}" font-size="${11 * u}" text-anchor="middle">${t}</text>`; }
  for (const [a, b, t] of EDGES) {
    const A = NODES[a], B = NODES[b];
    if (t === 'r') h += `<line class="river" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"/>`;
    else {
      const off = (PORTS[a] && !portOpen(a)) || (PORTS[b] && !portOpen(b)) || (t === 'n' && S.era < 3);
      h += `<line class="lane ${t}${off ? ' off' : ''}" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"/>`;
    }
  }
  h += `<g id="mRoute"></g>`;
  for (const [id, p] of Object.entries(PORTS)) {
    const n = NODES[id], lock = !portOpen(id), rr = (p.size >= 3 ? 4.2 : 3.4) * u;
    h += `<g class="${lock ? 'lock' : ''}"><circle class="port${p.size >= 3 ? ' big' : ''}${UI.port === id ? ' sel' : ''}" cx="${n.x}" cy="${n.y}" r="${rr}"/>`;
    if (!(UI.view === 'nea' && p.size < 2)) {
      let x = n.x, y = n.y, an = 'start';
      if (p.lab === 'r') { x += rr + 3 * u; y += fs / 3; }
      else if (p.lab === 'l') { x -= rr + 3 * u; y += fs / 3; an = 'end'; }
      else if (p.lab === 't') { y -= rr + 4 * u; an = 'middle'; }
      else { y += rr + fs + 1 * u; an = 'middle'; }
      h += `<text x="${x}" y="${y}" font-size="${fs}" text-anchor="${an}">${p.name}</text>`;
    }

function chartSvg() {
  const H = S.hist; if (H.length < 2) return '<p class="muted" style="margin:0">기록이 쌓이면 그래프가 그려집니다.</p>';
  const W = 640, Ht = 220, padL = 56, padR = 12, padT = 10, padB = 24;
  const all = H.flatMap(p => [p.me, ...p.r]).filter(v => v > 0);
  const lo = Math.log10(Math.max(100, Math.min(...all))), hi = Math.log10(Math.max(...all) * 1.1);
  const X = d => padL + (d - H[0].d) / Math.max(1, H[H.length - 1].d - H[0].d) * (W - padL - padR);
  const Y = v => padT + (1 - (Math.log10(Math.max(v, 100)) - lo) / Math.max(0.1, hi - lo)) * (Ht - padT - padB);
  let g = '';
  for (let e = Math.ceil(lo); e <= Math.floor(hi); e++) {
    const y = Y(10 ** e);
    g += `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${padL - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-num)">${e >= 6 ? (10 ** (e - 6)) + 'M' : e >= 3 ? (10 ** (e - 3)) + 'K' : 10 ** e}</text>`;
  }
  const line = (k, col, w) => `<polyline fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" points="${H.map(p => X(p.d).toFixed(1) + ',' + Y(k(p)).toFixed(1)).join(' ')}"/>`;
  const cols = ['var(--brand)', 'var(--muted)', 'var(--accent)'];
  S.rivals.forEach((r, i) => { g += line(p => p.r[i], cols[i], 1.5); });
  g += line(p => p.me, 'var(--mine)', 2.5);
  const last = H[H.length - 1];
  g += `<circle cx="${X(last.d)}" cy="${Y(last.me)}" r="4" fill="var(--mine)"/>`;
  g += `<text x="${padL}" y="${Ht - 6}" font-size="11" fill="var(--muted)">${dateStr(H[0].d).slice(0, 7)}</text><text x="${W - padR}" y="${Ht - 6}" font-size="11" fill="var(--muted)" text-anchor="end">${dateStr(last.d).slice(0, 7)}</text>`;
  const legend = [[S.name, 'var(--mine)'], ...S.rivals.map((r, i) => [r.name, cols[i]])].map(([n, c]) => `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:12px"><i style="width:12px;height:3px;background:${c};display:inline-block"></i>${esc(n)}</span>`).join('');
  return `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="순자산 추이 (로그 눈금)">${g}</svg><div style="margin-top:4px">${legend}</div>`;
}

function startModal(hasSave) {
  const pickBtn = (id, t, d) => `<button data-act="pickStart" data-p="${id}" class="${UI.startPick === id ? 'on' : ''}"><b>${t}</b><small>${d}</small></button>`;
  modal(`<h1>선박왕</h1><p>강가의 똑딱선 한 척으로 운송업을 시작해 동북아 바다를 누비는 선단을 만드세요. 화주의 화물을 날라 운임을 벌고, 기름값과 날씨를 따져 비용을 줄이고, 배를 늘려 라이벌 해운사 셋을 제치면 선박왕입니다.</p>
  ${hasSave ? `<button class="btn pri wide" data-act="continue">이어하기</button><p style="font-size:12px">또는 새 게임:</p>` : ''}
  <label for="coIn" style="font-weight:600;font-size:13px">회사 이름</label><input type="text" id="coIn" maxlength="12" value="한국해운">
  <div class="starts">${pickBtn('mapo', '한강 · 마포', '짧은 강 항로. 서울로 가는 화물이 많음')}${pickBtn('gupo', '낙동강 · 구포', '긴 강과 많은 나루. 부산과 바로 연결')}</div>
  <button class="btn ${hasSave ? '' : 'pri'} wide" data-act="start">새 게임 시작</button>
  <p style="font-size:12px">프로토타입 · 1~3시대 · 진행은 이 브라우저에 자동 저장됩니다.</p>`);
}
function eraModal() {
  const E = ERA[S.era];
  const ships = Object.values(SHIPS).filter(t => t.era === S.era).map(t => t.name).join(', ');
  const ports = Object.values(PORTS).filter(p => p.era === S.era).map(p => p.name).join(', ');
  const goods = Object.values(GOODS).filter(g => g.era === S.era).map(g => g.name).join(', ');
  modal(`<h1>${E.name}</h1><p>${S.name}의 순자산이 ${won(E.need)}을 넘었습니다. 더 크고 연료를 많이 쓰는 배와 더 먼 항로가 열립니다. 기름값이 운영에 더 크게 영향을 줍니다.</p><div class="card kv" style="grid-template-columns:1fr"><div><small>새 선박</small><b style="font-family:var(--f-body)">${ships}</b></div><div><small>새 항구</small><b style="font-family:var(--f-body)">${ports}</b></div><div><small>새 화물 종류</small><b style="font-family:var(--f-body)">${goods}</b></div></div>${S.era === 3 ? '<p>지도 오른쪽 위 「동북아」로 일본·중국 항로를 확인하세요.</p>' : ''}<button class="btn pri wide" data-act="close">계속</button>`);
}
function winModal() {
  modal(`<h1>선박왕 등극</h1><p>${dateStr(S.day)}, ${S.name}이(가) 순자산 ${won(netWorth())}으로 라이벌 해운사를 모두 제쳤습니다. 프로토타입의 목표를 달성했습니다. 계속 플레이할 수 있습니다.</p><button class="btn pri wide" data-act="close">계속 경영하기</button>`);
}
function overModal() {
  modal(`<h1>파산</h1><p>순자산이 0 아래로 떨어졌습니다. 고정비와 연료비가 운임보다 많은 배가 없는지, 불황에 계선을 했는지 확인해 보세요.</p><button class="btn pri wide" data-act="restart">처음부터</button>`);
}

/* ================= LOOP & INPUT ================= */
function setPlaying(v) { UI.playing = v; if (S) renderTop(); }
let lastTs = 0, lastPanel = 0;
function frame(ts) {
  const dt = lastTs ? Math.min(0.25, (ts - lastTs) / 1000) : 0; lastTs = ts;
  if (S && UI.playing && $('#modal').hidden) {
    UI.t += dt * UI.speed;
    let ticked = false;
    while (UI.t >= S.day + 1 && UI.playing) { tick(); ticked = true; }
    if (!UI.playing) UI.t = Math.min(UI.t, S.day + 0.999);
    if (ticked) render();
  }
  if (S && UI.view !== 'port3d') drawShips();
  P3.frame(dt);
  requestAnimationFrame(frame);
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }
function loadSave() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); return s && s.v === 2 ? s : null; } catch (e) { return null; } }

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = Number(el.dataset.id), sh = S && S.ships.find(s => s.id === id);
  switch (a) {
    case 'pickStart': UI.startPick = el.dataset.p; document.querySelectorAll('.starts button').forEach(b => b.classList.toggle('on', b.dataset.p === UI.startPick)); return;
    case 'start': newGame(($('#coIn').value || '').trim(), UI.startPick); closeModal(); drawMap(); render(); save(); return;
    case 'continue': S = loadSave(); UI.port = S.home; UI.t = S.day; closeModal(); drawMap(); render(); return;
    case 'close': closeModal(); render(); return;
    case 'restart': try { localStorage.removeItem(SAVE_KEY); } catch (e) {} UI.confirm = null; startModal(false); return;
  }
  if (!S) return;
  switch (a) {
    case 'play': setPlaying(!UI.playing); break;
    case 'speed': UI.speed = SPEEDS[(SPEEDS.indexOf(UI.speed) + 1) % SPEEDS.length]; break;
    case 'step': setPlaying(false); tick(); UI.t = S.day; break;
    case 'view': UI.view = el.dataset.v; drawMap(); break;
    case 'p3tab': UI.tab = el.dataset.t; UI.ship = null; UI.confirm = null; scrollToPanel(); SND.play('click'); break;
    case 'snd': SND.on = !SND.on; try { localStorage.setItem('shipking-snd', SND.on ? '1' : '0'); } catch (e) {} if (SND.on) SND.play('click'); break;
    case 'tab': UI.tab = el.dataset.t; UI.confirm = null; if (UI.tab === 'fleet') UI.ship = null; window.scrollTo({ top: 0 }); break;
    case 'ship': UI.ship = id; UI.tab = 'fleet'; UI.confirm = null; if (sh && sh.loc) UI.port = sh.loc; break;
    case 'back': UI.ship = null; UI.confirm = null; break;
    case 'port': UI.port = el.dataset.p; UI.tab = 'port'; drawMap(); break;
    case 'fuel': if (sh) doRefuel(sh, Number(el.dataset.f)); break;
    case 'load': if (sh) doLoad(Number(el.dataset.c), sh); break;
    case 'unload': if (sh) doUnload(Number(el.dataset.c), sh); break;
    case 'layup': if (sh) doLayup(sh); break;
    case 'react': if (sh) doReactivate(sh); break;
    case 'sail': if (sh) doSail(sh, el.dataset.to); break;
    case 'fish': if (sh) doFish(sh); break;
    case 'mode': if (sh) sh.mode = el.dataset.m; break;
    case 'order': doOrder(el.dataset.type); break;
    case 'buyused': doBuyUsed(el.dataset.u); break;
    case 'askSell': UI.confirm = 'sell' + id; break;
    case 'sellship': if (sh) doSellShip(sh); break;
    case 'askNew': UI.confirm = 'new'; break;
    case 'newgame': UI.confirm = null; setPlaying(false); startModal(false); return;
    case 'cancel': UI.confirm = null; break;
  }
  render(); save();
});
document.addEventListener('change', ev => {
  if (!S) return;
  if (ev.target.id === 'portSel') { UI.port = ev.target.value; drawMap(); render(); }
  if (ev.target.id === 'optPause') { S.autoPause = ev.target.checked; save(); }
  if (ev.target.id === 'optTip') { S.tip = ev.target.checked; save(); }
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S) drawMap(); }, 120); });
document.addEventListener('visibilitychange', () => { if (document.hidden && S) { save(); setPlaying(false); } });
document.addEventListener('keydown', ev => { if (ev.code === 'Space' && S && $('#modal').hidden && !/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) { ev.preventDefault(); setPlaying(!UI.playing); } });

function scrollToPanel() {
  if (window.innerWidth < 960) $('#tabs').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
let p3Ready = false;
function start(data) {
  p3Ready = P3.ok && P3.init($('#p3'), (kind, v) => {
    if (kind === 'ship') { UI.ship = v; UI.tab = 'fleet'; UI.confirm = null; SND.play('click'); }
    if (kind === 'tab') { UI.tab = v; UI.ship = null; UI.confirm = null; SND.play('click'); }
    render(); scrollToPanel();
  });
  if (!p3Ready && UI.view === 'port3d') UI.view = 'kr';
  if (data && data.S) { S = data.S; Object.assign(UI, data.UI || {}); UI.playing = false; drawMap(); render(); }
  else { if (p3Ready) { $('#map').style.visibility = 'hidden'; $('#legend').hidden = true; P3.show(); } startModal(!!loadSave()); }
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({ S, UI: { tab: UI.tab, ship: UI.ship, port: UI.port, view: UI.view, speed: UI.speed, t: UI.t } }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
