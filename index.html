<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>방유안 · 2nd Term Final Exam 진도표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F5F1;
    --card: #FFFFFF;
    --text: #22221F;
    --muted: #83807A;
    --line: #E5E2DB;
    --line-soft: #EDEBE5;
    --navy: #2C3E50;
    --navy-dark: #22303D;
    --navy-line: #3D4F5E;
    --navy-muted: #9FB0BE;
    --navy-soft: #B8C4CC;
    --good: #5B7A5E;
    --ok: #C08A3E;
    --warn: #B0503F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .wrap {
    width: 100%;
    max-width: 900px;
    background: var(--bg);
    border-radius: 12px;
    border: 1px solid var(--line);
    overflow: hidden;
  }
  /* header */
  .header {
    background: var(--navy);
    color: var(--bg);
    padding: 28px 32px 24px;
  }
  .header-inner {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 20px;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--navy-muted);
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: 30px;
    font-weight: 700;
    margin: 0;
    line-height: 1.2;
  }
  .avg-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--navy-soft);
    margin-top: 8px;
  }
  .dday-card {
    background: var(--navy-dark);
    border-radius: 10px;
    padding: 14px 20px;
    min-width: 168px;
    border: 1px solid var(--navy-line);
  }
  .dday-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--navy-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
    cursor: pointer;
  }
  .dday-value {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    cursor: pointer;
  }
  .dday-placeholder {
    font-size: 13px;
    color: var(--navy-soft);
    cursor: pointer;
  }
  #examDateInput {
    width: 100%;
    background: var(--bg);
    border: none;
    border-radius: 6px;
    padding: 6px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text);
    display: none;
  }
  /* table header */
  .col-header {
    display: grid;
    grid-template-columns: 92px 1.4fr 1.6fr 90px 110px 60px;
    padding: 10px 32px;
    gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #A8A59E;
    border-bottom: 1px solid var(--line);
  }
  /* rows */
  .row {
    display: grid;
    grid-template-columns: 92px 1.4fr 1.6fr 90px 110px 60px;
    align-items: center;
    padding: 14px 32px;
    gap: 12px;
    border-bottom: 1px solid var(--line-soft);
    border-left: 3px solid transparent;
    transition: background 0.15s ease, border-left-color 0.15s ease;
  }
  .row:hover { background: #FBFAF7; }
  .subj-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #A8A59E;
    letter-spacing: 1px;
  }
  .subj-name {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--text);
  }
  .bar-track {
    height: 8px;
    background: var(--line-soft);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .bar-fill {
    height: 100%;
    border-radius: 999px;
    transition: width 0.3s ease, background 0.2s ease;
  }
  .progress-slider {
    width: 100%;
    height: 14px;
    accent-color: var(--navy);
  }
  .pct-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 600;
  }
  .status-dots {
    display: flex;
    gap: 4px;
  }
  .status-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
    opacity: 0.25;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .status-dot:active { transform: scale(0.94); }
  .status-dot.active { opacity: 1; }
  .status-tag {
    font-size: 11.5px;
    font-family: 'JetBrains Mono', monospace;
    padding: 3px 8px;
    border-radius: 5px;
    width: fit-content;
  }
  .memo-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--card);
    color: #A8A59E;
    cursor: pointer;
  }
  .memo-btn.has-memo {
    border-color: var(--navy);
    background: #2C3E5010;
    color: var(--navy);
  }
  .memo-panel {
    display: none;
    padding: 0 32px 16px;
    border-bottom: 1px solid var(--line-soft);
    background: #FBFAF7;
  }
  .memo-panel.open { display: block; }
  .memo-area {
    width: 100%;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text);
    background: var(--card);
    outline: none;
    font-family: 'Pretendard', sans-serif;
    box-sizing: border-box;
  }
  /* footer */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 32px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #A8A59E;
  }
  .save-indicator { display: flex; align-items: center; gap: 5px; }
  @media (max-width: 640px) {
    .col-header { display: none; }
    .row {
      grid-template-columns: 1fr;
      grid-template-areas:
        "name"
        "bar"
        "meta";
      gap: 8px;
      padding: 16px 18px;
    }
    .row > *:nth-child(1) { grid-area: name; }
    .row > *:nth-child(2) { grid-area: bar; }
    .row > *:nth-child(3) { display: none; }
    .row > *:nth-child(4),
    .row > *:nth-child(5),
    .row > *:nth-child(6) {
      grid-area: meta;
      display: inline-flex;
    }
    .row > *:nth-child(4) { order: 1; }
    .row > *:nth-child(5) { order: 2; }
    .row > *:nth-child(6) { order: 3; margin-left: auto; }
    .row {
      display: flex;
      flex-direction: column;
    }
    .row > div:nth-child(4),
    .row > div:nth-child(5),
    .row > button:nth-child(6) {
      display: inline-flex;
    }
    .meta-line { display: flex; gap: 10px; align-items: center; }
    .header { padding: 22px 18px 18px; }
    .memo-panel { padding: 0 18px 16px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <!-- 헤더 -->
  <div class="header">
    <div class="header-inner">
      <div>
        <div class="eyebrow">Auckland Grammar School · Year 10</div>
        <h1 id="titleText">방유안의 2nd Term Final Exam</h1>
        <div class="avg-line" id="avgLine">전체 평균 진도 0%</div>
      </div>
      <div class="dday-card">
        <div class="dday-label" id="ddayLabelToggle">
          <span>📅</span> 시험일 <span style="margin-left:auto;">▾</span>
        </div>
        <input type="date" id="examDateInput" />
        <div class="dday-value" id="ddayValue" style="display:none;"></div>
        <div class="dday-placeholder" id="ddayPlaceholder">날짜를 입력하세요</div>
      </div>
    </div>
  </div>

  <!-- 표 헤더 -->
  <div class="col-header">
    <div>과목</div>
    <div>기출문제 진도</div>
    <div>완료율</div>
    <div>상태</div>
    <div>상태 라벨</div>
    <div></div>
  </div>

  <!-- 과목 행 컨테이너 -->
  <div id="rows"></div>

  <!-- 푸터 -->
  <div class="footer">
    <span>이 브라우저에 저장됨 · 기기마다 별도 저장</span>
    <span class="save-indicator" id="saveIndicator">💾 저장됨</span>
  </div>
</div>

<script>
  const SUBJECTS = [
    { id: "math", code: "MAT", name: "Mathematics" },
    { id: "eng", code: "ENG", name: "English" },
    { id: "bio", code: "BIO", name: "Biology" },
    { id: "chem", code: "CHE", name: "Chemistry" },
    { id: "phys", code: "PHY", name: "Physics" },
    { id: "geo", code: "GEO", name: "Geometry" },
    { id: "his", code: "HIS", name: "History" },
    { id: "bea", code: "BEA", name: "BEA" },
    { id: "esol", code: "ESL", name: "ESOL" },
  ];

  const STATUS = {
    good: { label: "좋음", color: "#5B7A5E", bg: "#5B7A5E14" },
    ok:   { label: "보통", color: "#C08A3E", bg: "#C08A3E14" },
    warn: { label: "주의필요", color: "#B0503F", bg: "#B0503F14" },
  };
  const STATUS_ORDER = ["good", "ok", "warn"];

  const STORAGE_KEY = "examtracker:v1";

  function defaultData() {
    const subjects = {};
    SUBJECTS.forEach(s => {
      subjects[s.id] = { progress: 0, status: "ok", memo: "" };
    });
    return { examDate: "", subjects };
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultData();
      const parsed = JSON.parse(raw);
      const base = defaultData();
      return {
        examDate: parsed.examDate || "",
        subjects: { ...base.subjects, ...(parsed.subjects || {}) },
      };
    } catch (e) {
      return defaultData();
    }
  }

  let data = loadData();
  let saveTimer = null;

  function persist() {
    const indicator = document.getElementById("saveIndicator");
    indicator.textContent = "💾 저장 중...";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      indicator.textContent = "💾 저장됨";
    }, 400);
  }

  function daysUntil(dateStr) {
    if (!dateStr) return null;
    const target = new Date(dateStr + "T00:00:00");
    const now = new Date();
    now.setHours(0,0,0,0);
    return Math.round((target - now) / 86400000);
  }

  function renderDday() {
    const dday = daysUntil(data.examDate);
    const valueEl = document.getElementById("ddayValue");
    const placeholderEl = document.getElementById("ddayPlaceholder");
    if (data.examDate) {
      valueEl.style.display = "block";
      placeholderEl.style.display = "none";
      valueEl.textContent = dday > 0 ? `D-${dday}` : dday === 0 ? "D-Day" : `D+${Math.abs(dday)}`;
    } else {
      valueEl.style.display = "none";
      placeholderEl.style.display = "block";
    }
  }

  function renderAvg() {
    const total = SUBJECTS.reduce((sum, s) => sum + (data.subjects[s.id]?.progress || 0), 0);
    const avg = Math.round(total / SUBJECTS.length);
    document.getElementById("avgLine").textContent = `전체 평균 진도 ${avg}%`;
  }

  function buildRows() {
    const container = document.getElementById("rows");
    container.innerHTML = "";
    SUBJECTS.forEach(subj => {
      const d = data.subjects[subj.id];
      const status = STATUS[d.status];

      const row = document.createElement("div");
      row.className = "row";
      row.style.borderLeftColor = status.color;

      row.innerHTML = `
        <div>
          <div class="subj-code">${subj.code}</div>
          <div class="subj-name">${subj.name}</div>
        </div>
        <div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${d.progress}%; background:${status.color};"></div>
          </div>
          <input type="range" class="progress-slider" min="0" max="100" step="5" value="${d.progress}" data-id="${subj.id}" />
        </div>
        <div class="pct-value">${d.progress}%</div>
        <div class="status-dots">
          ${STATUS_ORDER.map(key => `
            <button class="status-dot ${d.status === key ? 'active' : ''}"
                    style="background:${STATUS[key].color}; ${d.status === key ? `border-color:${STATUS[key].color};` : ''}"
                    data-id="${subj.id}" data-status="${key}" title="${STATUS[key].label}"></button>
          `).join("")}
        </div>
        <div class="status-tag" style="color:${status.color}; background:${status.bg};">${status.label}</div>
        <button class="memo-btn ${d.memo ? 'has-memo' : ''}" data-memo-toggle="${subj.id}" title="메모">💬</button>
      `;
      container.appendChild(row);

      const memoPanel = document.createElement("div");
      memoPanel.className = "memo-panel";
      memoPanel.id = `memo-${subj.id}`;
      memoPanel.innerHTML = `
        <textarea class="memo-area" rows="2" placeholder="${subj.name} 관련 메모를 적어주세요 (예: 미적분 단원 약함, 다음 주 보충 필요)" data-memo-input="${subj.id}">${d.memo}</textarea>
      `;
      container.appendChild(memoPanel);
    });

    // 슬라이더 이벤트
    container.querySelectorAll(".progress-slider").forEach(slider => {
      slider.addEventListener("input", (e) => {
        const id = e.target.dataset.id;
        data.subjects[id].progress = Number(e.target.value);
        updateRowVisual(id);
        renderAvg();
        persist();
      });
    });

    // 상태 점 이벤트
    container.querySelectorAll(".status-dot").forEach(dot => {
      dot.addEventListener("click", (e) => {
        const id = e.target.dataset.id;
        const statusKey = e.target.dataset.status;
        data.subjects[id].status = statusKey;
        buildRows();
        persist();
      });
    });

    // 메모 토글
    container.querySelectorAll("[data-memo-toggle]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const id = e.currentTarget.dataset.memoToggle;
        const panel = document.getElementById(`memo-${id}`);
        const isOpen = panel.classList.contains("open");
        document.querySelectorAll(".memo-panel.open").forEach(p => p.classList.remove("open"));
        if (!isOpen) panel.classList.add("open");
      });
    });

    // 메모 입력
    container.querySelectorAll("[data-memo-input]").forEach(area => {
      area.addEventListener("input", (e) => {
        const id = e.target.dataset.memoInput;
        data.subjects[id].memo = e.target.value;
        persist();
        const btn = document.querySelector(`[data-memo-toggle="${id}"]`);
        btn.classList.toggle("has-memo", !!e.target.value);
      });
    });
  }

  function updateRowVisual(id) {
    const d = data.subjects[id];
    const status = STATUS[d.status];
    const slider = document.querySelector(`.progress-slider[data-id="${id}"]`);
    const row = slider.closest(".row");
    row.querySelector(".bar-fill").style.width = d.progress + "%";
    row.querySelector(".pct-value").textContent = d.progress + "%";
  }

  // D-Day 입력
  const ddayToggle = document.getElementById("ddayLabelToggle");
  const examDateInput = document.getElementById("examDateInput");
  examDateInput.value = data.examDate;

  function openDateInput() {
    examDateInput.style.display = "block";
    document.getElementById("ddayValue").style.display = "none";
    document.getElementById("ddayPlaceholder").style.display = "none";
    examDateInput.focus();
  }
  function closeDateInput() {
    examDateInput.style.display = "none";
    renderDday();
  }
  ddayToggle.addEventListener("click", openDateInput);
  document.getElementById("ddayValue").addEventListener("click", openDateInput);
  document.getElementById("ddayPlaceholder").addEventListener("click", openDateInput);
  examDateInput.addEventListener("change", (e) => {
    data.examDate = e.target.value;
    persist();
  });
  examDateInput.addEventListener("blur", closeDateInput);

  // 초기 렌더
  renderDday();
  renderAvg();
  buildRows();
</script>

</body>
</html>
